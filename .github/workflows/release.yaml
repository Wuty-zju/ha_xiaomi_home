name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Verify published component files without replacing the asset
        run: |
          gh release download "$RELEASE_TAG" --pattern xiaomi_home.zip --dir downloaded
          python - <<'PYCODE'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          prefix = 'custom_components/xiaomi_home/'
          paths = subprocess.check_output([
              'git', 'ls-tree', '-r', '--name-only', 'HEAD', '--',
              prefix, 'LICENSE.md', 'LegalNotice.md'], text=True).splitlines()
          expected = {
              p.removeprefix(prefix): subprocess.check_output([
                  'git', 'show', 'HEAD:' + p]) for p in paths}
          asset = Path('downloaded/xiaomi_home.zip')
          with zipfile.ZipFile(asset) as archive:
              assert archive.testzip() is None
              assert len(archive.namelist()) == len(expected)
              assert set(archive.namelist()) == set(expected)
              assert all(archive.read(p) == data
                         for p, data in expected.items())
              version = json.loads(archive.read('manifest.json'))['version']
              assert version == os.environ['RELEASE_TAG']
          print(hashlib.sha256(asset.read_bytes()).hexdigest())
          PYCODE
